<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="190" viewBox="0 0 1280 190" role="img" aria-labelledby="title"><title id="title">Listen, assess, connect and follow through</title><rect width="1280" height="190" fill="#F3F5F9"/><text x="32" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#B4570F" letter-spacing="1.5">01</text><text x="32" y="86" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1F2842" >Listen</text><text x="32" y="126" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5568" >Business goal &amp; local context</text><path d="M32 155h260" stroke="#D0D7E2"/><path d="M32 155h40" stroke="#2347A8" stroke-width="2"/><text x="352" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#B4570F" letter-spacing="1.5">02</text><text x="352" y="86" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1F2842" >Assess</text><text x="352" y="126" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5568" >Fit, timing &amp; sensible options</text><path d="M352 155h260" stroke="#D0D7E2"/><path d="M352 155h40" stroke="#2347A8" stroke-width="2"/><text x="672" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#B4570F" letter-spacing="1.5">03</text><text x="672" y="86" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1F2842" >Connect</text><text x="672" y="126" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5568" >Relevant people &amp; discussions</text><path d="M672 155h260" stroke="#D0D7E2"/><path d="M672 155h40" stroke="#2347A8" stroke-width="2"/><text x="992" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#B4570F" letter-spacing="1.5">04</text><text x="992" y="86" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1F2842" >Follow through</text><text x="992" y="126" font-family="Arial, sans-s